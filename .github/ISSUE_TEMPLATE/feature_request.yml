name: Feature request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task an assistant should be able to do through SynapCores.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?

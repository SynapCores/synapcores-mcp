name: mcp-registry
# Manual: publish server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# Run only after @synapcores/mcp at the same version is on npm. Uses GitHub OIDC, which
# proves ownership of the io.github.SynapCores/* namespace because this repo is in the SynapCores org.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches package.json
        run: |
          V="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./server.json').version")" = "$V"
          test "$(node -p "require('./server.json').packages[0].version")" = "$V"
          test "$(node -p "require('./package.json').mcpName")" = "$(node -p "require('./server.json').name")"
      - name: Install mcp-publisher (pinned version, checksum verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.8
          MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

name: publish
# Push a tag like v1.0.0 to publish @synapcores/mcp to npm and server.json to the MCP Registry.
# Requires repository secret NPM_TOKEN (npm automation token for the @synapcores scope).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write # npm provenance + MCP Registry GitHub OIDC login
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').version")" = "$TAG"
          test "$(node -p "require('./server.json').packages[0].version")" = "$TAG"
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
